# Oracle's free ARM server: one run keeps trying every 10 minutes for about 5.5 hours, then starts the next run itself
# (a public repo has no limit on minutes). Once the server exists, everything switches itself off.
# The schedule is only a backup in case the chain ever breaks. Needs the six secrets listed in README.md.
name: Oracle server try

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: oracle-try
  cancel-in-progress: false

jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: 'True'
      SUPPRESS_LABEL_WARNING: 'True'
      C: ${{ secrets.OCI_TENANCY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: OCI CLI
        run: pip install --quiet oci-cli

      - name: Oracle settings
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_KEY" > ~/.oci/key.pem
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=%s\nkey_file=%s\n' \
            "$OCI_USER" "$OCI_FINGERPRINT" "$C" "$OCI_REGION" "$HOME/.oci/key.pem" > ~/.oci/config
          chmod 600 ~/.oci/key.pem ~/.oci/config
          printf '%s\n' "$SSH_PUBLIC_KEY" > ~/ssh.pub

      - name: Keep trying (every 10 minutes)
        run: |
          stop() { gh workflow disable try.yml -R "$GITHUB_REPOSITORY" || true; }
          AD=$(oci iam availability-domain list -c "$C" --query 'data[0].name' --raw-output)
          SUBNET=$(oci network subnet list -c "$C" --query 'data[0].id' --raw-output)
          IMG=$(oci compute image list -c "$C" --operating-system "Canonical Ubuntu" --operating-system-version "24.04" \
            --shape VM.Standard.A1.Flex --sort-by TIMECREATED --sort-order DESC --query 'data[0].id' --raw-output)
          end=$(( $(date +%s) + 330*60 ))
          n=0
          while [ "$(date +%s)" -lt "$end" ]; do
            n=$((n+1))
            # Made already (by this run, an earlier one, or by hand)? Nothing printed means none at all.
            made=$(oci compute instance list -c "$C" --display-name madarsahub-server \
              --query "length(data[?\"lifecycle-state\"!='TERMINATED' && \"lifecycle-state\"!='TERMINATING'])" --raw-output 2>/dev/null || true)
            if [ "${made:-0}" -gt 0 ] 2>/dev/null; then echo "$(date -u +%H:%M) Server bana hua hai. Ye kaam band."; stop; exit 0; fi
            for size in "2 12" "1 6"; do
              set -- $size
              OUT=$(oci compute instance launch --availability-domain "$AD" -c "$C" \
                --shape VM.Standard.A1.Flex --shape-config "{\"ocpus\":$1,\"memoryInGBs\":$2}" \
                --image-id "$IMG" --subnet-id "$SUBNET" --assign-public-ip true \
                --boot-volume-size-in-gbs 100 --display-name madarsahub-server \
                --ssh-authorized-keys-file ~/ssh.pub 2>&1) || true
              if echo "$OUT" | grep -q '"lifecycle-state"'; then echo "$(date -u +%H:%M) SERVER BAN GAYA! ($1 CPU / $2 GB)"; stop; exit 0; fi
              if echo "$OUT" | grep -qi 'out of host capacity\|out of capacity'; then echo "$(date -u +%H:%M) koshish $n, $1 CPU / $2 GB: abhi jagah nahi"; sleep 45; continue; fi
              if echo "$OUT" | grep -qi 'toomanyrequests\|too many requests'; then echo "$(date -u +%H:%M) koshish $n: Oracle ne roka"; sleep 300; break; fi
              echo "$(date -u +%H:%M) Koi aur masla:"; echo "$OUT" | grep -iE '"code"|"message"' | head -6; exit 1
            done
            sleep 510
          done
          echo "Ye daur khatam, agla khud shuru."
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/try.yml/dispatches" -f ref=main
